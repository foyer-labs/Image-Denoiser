name: Test e build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,build]"
      - name: Crea l'eseguibile
        run: pyinstaller packaging/denoiser.spec --noconfirm
      - name: Verifica la riga di comando
        run: dist\Denoiser\denoiser-cli.exe --version
      - name: Verifica l'avvio dell'interfaccia
        shell: pwsh
        env:
          DENOISER_SMOKE_TEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\Denoiser\Denoiser.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Denoiser.exe è terminato con codice $($p.ExitCode)" }
      - name: Comprimi
        shell: pwsh
        run: Compress-Archive -Path dist\Denoiser -DestinationPath Denoiser-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Denoiser-windows
          path: Denoiser-windows.zip
          retention-days: 30
